# DHIS2 on Dokploy (demo/test setup, loads the Sierra Leone demo DB).
# Set these in the Dokploy Environment tab:
#   DB_USERNAME=dhis
#   DB_PASSWORD=<strong password>
#   DHIS2_IMAGE=dhis2/core-dev:latest   (optional, this is the default)
#   DB_NAME=dhis                        (optional)
# Then add a Domain in Dokploy: service "web", port 8080.

services:
  web:
    image: "${DHIS2_IMAGE:-dhis2/core-dev:latest}"
    restart: unless-stopped
    environment:
      DB_HOSTNAME: db
      DB_NAME: ${DB_NAME:-dhis}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    configs:
      - source: dhis_conf
        target: /opt/dhis2/dhis.conf
    ports:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: ghcr.io/baosystems/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME:-dhis}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPASSWORD: ${DB_PASSWORD} # needed by psql in healthcheck
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-dump:/docker-entrypoint-initdb.d/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'psql --no-password --quiet --username $$POSTGRES_USER postgres://127.0.0.1/$$POSTGRES_DB -p 5432 --command "SELECT ''ok''" > /dev/null',
        ]
      start_period: 120s
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db-dump:
        condition: service_completed_successfully

  db-dump:
    image: busybox:latest
    # only download the dump if it does not already exist
    command: sh -c '[ -f dump.sql.gz ] && echo "dump.sql.gz exists" || wget --output-document dump.sql.gz $$DHIS2_DB_DUMP_URL'
    environment:
      DHIS2_DB_DUMP_URL: "${DHIS2_DB_DUMP_URL:-https://databases.dhis2.org/sierra-leone/dev/dhis2-db-sierra-leone.sql.gz}"
    working_dir: /opt/dump
    volumes:
      - db-dump:/opt/dump

# Inline config, so no ./docker/ files are needed in the repo
configs:
  dhis_conf:
    content: |
      connection.dialect = org.hibernate.dialect.PostgreSQLDialect
      connection.driver_class = org.postgresql.Driver
      connection.url = jdbc:postgresql://db:5432/${DB_NAME:-dhis}
      connection.username = ${DB_USERNAME}
      connection.password = ${DB_PASSWORD}

volumes:
  db-data: {}
  db-dump: {}
